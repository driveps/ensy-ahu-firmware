# Every push to main that touches the firmware builds it and publishes a release.
# Boards poll releases/latest/download/manifest.json and install any new version.
name: Release firmware

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install ESPHome
        run: pip install -r requirements.txt

      - name: Version
        id: v
        run: echo "version=$(date -u +%Y.%m.%d).${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: esphome -s fw_version "${{ steps.v.outputs.version }}" compile ensy-ahu.yaml

      - name: Package
        run: |
          mkdir dist
          cp "$(find .esphome/build/ensy-ahu -name firmware.ota.bin | head -1)" dist/
          cp "$(find .esphome/build/ensy-ahu -name firmware.factory.bin | head -1)" dist/
          python3 .github/make_manifest.py dist "${{ steps.v.outputs.version }}" \
            "${{ github.repository }}" "$(git log -1 --format=%s)"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.v.outputs.version }}" dist/* \
            --title "${{ steps.v.outputs.version }}" \
            --notes "$(git log -1 --format=%B)" --latest

# Debug package: registers that exist (2026-10-11 sweep) but aren't in the LMC311 manual,
# plus the "Last register change" tracker. Home board only: included by the local
# dashboard stub (../ensy-ahu.yaml), not by ensy-ahu.yaml, so releases skip it. See docs/ensy-ahu-registers.md.

script:
  # Debug: record changes of the "Debug" registers ("H1100: 1 → 0").
  # The first value after boot is only remembered, not reported.
  - id: reg_changed
    mode: queued
    max_runs: 60
    parameters:
      reg: string
      val: float
    then:
      - lambda: |-
          static std::map<std::string, int> last;
          int v = (int) val;
          auto it = last.find(reg);
          if (it == last.end()) { last[reg] = v; return; }
          if (it->second == v) return;
          std::string msg = reg + ": " + std::to_string(it->second) + " → " + std::to_string(v);
          it->second = v;
          ESP_LOGI("ensy", "register change %s", msg.c_str());
          id(last_reg_change).publish_state(msg);


sensor:
  # Debug: registers that exist (2026-10-11 sweep) but aren't in the LMC311 manual.
  # Raw signed values, read-only. Change one panel setting at a time and watch
  # "Last register change" to see which register it maps to. See docs/ensy-ahu-registers.md.

    modbus_controller_id: ensy
    name: "Debug I107"
    register_type: read
    address: 107
    value_type: S_WORD
    accuracy_decimals: 0
    entity_category: diagnostic
    on_value:
      - script.execute: {id: reg_changed, reg: "I107", val: !lambda "return x;"}

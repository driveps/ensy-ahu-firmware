# ── CONTROL: selects (holding, FC16) ───────────────────────────────
select:
  - platform: modbus_controller
    modbus_controller_id: ensy
    name: "Fan step"
    id: fan_sel
    internal: true                # driven via the Ventilation climate
    address: 1003                 # Control.VentSet
    use_write_multiple: true
    optionsmap:
      "Off": 0
      "Step 1": 1
      "Step 2": 2
      "Step 3": 3
  - platform: modbus_controller
    modbus_controller_id: ensy
    name: "Mode"
    id: mode_sel
    internal: true                # driven via the Ventilation climate
    address: 1002                 # Control.ModeSet (4 = Service is read-only; use Service mode)
    use_write_multiple: true
    optionsmap:
      "Off": 0
      "Heat": 1
      "Cool": 2
      "Auto": 3
  - platform: modbus_controller
    modbus_controller_id: ensy
    name: "Boost mode raw"
    id: boost_sel
    internal: true                # driven via Boost / Cooker hood switches and climate presets
    address: 551                  # PartyMode: 1=start, 2=stop
    use_write_multiple: true
    optionsmap:
      "Start": 1
      "Stop": 2
  - platform: modbus_controller
    modbus_controller_id: ensy
    name: "Week program"
    address: 500                  # Program.Select — "4 = Erase" deliberately left out
    use_write_multiple: true
    entity_category: config
    optionsmap:
      "None": 0
      "Program 1": 1
      "Program 2": 2
      "Program 3": 3
  - platform: modbus_controller
    modbus_controller_id: ensy
    name: "Service mode"
    address: 1005                 # Control.ServiceMode
    use_write_multiple: true
    entity_category: config
    optionsmap:
      "Off": 0
      "Defrost": 1
      "Flaps": 2
      "Inlet": 3
      "Exhaust": 4

  # User functions: what they do and which fan step they use
  - platform: modbus_controller
    modbus_controller_id: ensy
    name: "User function 1"
    address: 601
    use_write_multiple: true
    entity_category: config
    optionsmap: &uf_func
      "None": 0
      "Extend": 1
      "Inlet": 2
      "Exhaust": 3
      "External heater offset": 4
      "Ventilate": 5
      "Cooker hood": 6
  - platform: modbus_controller
    modbus_controller_id: ensy
    name: "User function 1 fan step"
    address: 603
    use_write_multiple: true
    entity_category: config
    optionsmap: &uf_step
      "Off": 0
      "Step 1": 1
      "Step 2": 2
      "Step 3": 3
      "Step 4": 4
  - platform: modbus_controller
    modbus_controller_id: ensy
    name: "User function 2"
    address: 611
    use_write_multiple: true
    entity_category: config
    optionsmap: *uf_func
  - platform: modbus_controller
    modbus_controller_id: ensy
    name: "User function 2 fan step"
    address: 613
    use_write_multiple: true
    entity_category: config
    optionsmap: *uf_step

  # Humidity / CO2 fan steps (holding 1910, 1911, 1920)
  - platform: modbus_controller
    modbus_controller_id: ensy
    name: "Humidity low fan step"   # RH_VentLo (winter)
    address: 1910
